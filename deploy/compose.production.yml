# 本番の構成。ClickHouseは外へ開かず、APIだけをloopbackに開いて、前段のnginxからつなぐ。
# ほかのサービスと同じVMに置けるよう、メモリとCPUに上限を付ける。
name: mado-data-search

x-application: &application
  image: "${MDS_IMAGE:?.env に MDS_IMAGE を digest 固定で設定してください}"
  restart: unless-stopped
  env_file: .env
  environment:
    NODE_ENV: production
    MDS_CLICKHOUSE_URL: http://clickhouse:8123
  volumes:
    - ./sources.yaml:/config/sources.yaml:ro
  depends_on:
    clickhouse:
      condition: service_healthy

services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.10.2
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: mado_data_search
      CLICKHOUSE_PASSWORD: "${MDS_CLICKHOUSE_PASSWORD:?.env に MDS_CLICKHOUSE_PASSWORD を設定してください}"
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "0"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/low-resource.xml:/etc/clickhouse-server/config.d/low-resource.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    mem_limit: "${MDS_CLICKHOUSE_MEMORY:-4g}"
    cpus: "${MDS_CLICKHOUSE_CPUS:-4}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping | grep -q Ok"]
      interval: 5s
      timeout: 3s
      retries: 30

  api:
    <<: *application
    ports:
      - "127.0.0.1:4195:4195"
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4195/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 6

  ingest:
    <<: *application
    command: ["node", "--conditions=compiled", "apps/api/dist/ingestWorker.js"]
    mem_limit: 1g

volumes:
  clickhouse-data:
